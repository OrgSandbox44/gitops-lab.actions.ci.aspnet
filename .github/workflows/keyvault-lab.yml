name: ReadOutKeyVaultSecrets
 
# Controls when the workflow will run
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  read-secrets:
    runs-on: ubuntu-latest
    steps:
    - name: Login via Azure CLI
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Read out KeyVault secrets
      shell: bash
      run: MY_SECRET=$(az keyvault secret show --vault-name kv-kevault-lab-bp --name MySecret --query value -o tsv)
    - name: Write secret to file
      shell: bash
      run: |
        echo "$MY_SECRET" > ${{ runner.temp }}/mysecret
    - name: Upload the secret artifact
      uses: actions/upload-artifact@v7
      with: 
        name: mysecret
        path: ${{ runner.temp }}/mysecret




