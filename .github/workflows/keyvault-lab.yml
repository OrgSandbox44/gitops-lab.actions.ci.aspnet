name: ReadOutKeyVaultSecrets
 
# Controls when the workflow will run
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  read-secrets:
    runs-on: ubuntu-latest
    steps:
    - name: Login via Azure CLI
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Read out KeyVault secrets
      shell: bash
      run: MY_SECRET=$(az keyvault secret show --vault-name kv-kevault-lab-bp --name MySecret --query value -o tsv)
  write-secret-to-file:
    runs-on: ubuntu-latest
    needs: read-secrets
    steps:
    - name: Write secret to file
      shell: bash
      run: |
        echo "${{ secrets.MY_SECRET }}" > ${{ runner.temp }}/artifact/mysecret.txt
  Publish-artifact:
    runs-on: ubuntu-latest
    needs: write-secret-to-file
    steps:
    - name: Upload the secret artifact
      uses: actions/upload-artifact@v7
      with: 
        name: mysecret.txt
        path: ${{ runner.temp }}/artifact





